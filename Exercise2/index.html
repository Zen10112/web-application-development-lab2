
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Mini React - Reactive Task Manager</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      line-height: 1.5;
      color: #1a1a1a;
      background: #ffffff;
    }

    .app-container {
      max-width: 700px;
      margin: 0 auto;
    }

    button {
      min-width: 44px;
      min-height: 44px;
      padding: 10px 16px;
      font: inherit;
      color: white;
      background: #174ea6;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 3px solid #ff9900;
      outline-offset: 3px;
    }

    li {
      margin: 8px 0;
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script
    type="module"
    src="./checkpoint2-verify.js">
  </script>
</body>
</html>
